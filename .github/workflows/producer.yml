name: GH012 private artifact producer

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Create inert private Pages payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>GH012 B</title><p>GH012-B-PRIVATE-CANARY</p>' > site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb
        with:
          name: github-pages
          path: site
          retention-days: 1
